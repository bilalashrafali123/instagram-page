<head>

               <hr>
             <div>

             </div>
            </div>
            
            
        </div>
    </div> <br><br>

    </div>
     
    <div class="get-the-app-section">
        <div>
            <p>Get the app.</p>
            <img src="./src/googleplay.png" alt="img">
            <img class="microsoft-logo" src="./src/microsoft.png" alt="img">
          
            

        </div>
    </div>
       </div>
    </div>
    </section>
